[project]
name = "python-mcp-tools"
version = "0.1.0"
description = "Reusable Python MCP tools for publishing and external integrations."
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "markdown-it-py>=3.0.0",
  "mcp>=1.9.0",
]

[project.scripts]
mcp-tools-hub = "mcp_tools_hub.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
